[package]
name = "gitnav"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
